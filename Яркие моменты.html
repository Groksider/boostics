        excerpt: 'Иногда посреди бесконечных сражений и рейдов нужно просто остановиться на холме Боклера и насладиться пейзажем.',
        author: 'GeraltOfRivia',
        author_avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop',
        created_at: '2026-09-12T16:00:00Z', // Сентябрь, Неделя 2
        reactions: { '🔥': 11, '❤️': 14, '🚀': 2, '⚡': 0, '🏆': 3, '💎': 4 },
        userReactions: {}
      }
    ];

    // СОСТОЯНИЯ ФИЛЬТРАЦИИ
    let isArchiveActive = false;
    let selectedAuthor = 'all';
    let searchQuery = '';
    let authorSearchQuery = '';
    let selectedMonthKey = 'all';
    let selectedWeek = 'all';

    const momentsGrid = document.getElementById('moments-grid');
    const imageModal = document.getElementById('image-modal');
    const imageModalContent = document.getElementById('image-modal-content');
    const modalImageDisplay = document.getElementById('modal-image-display');

    function getWeekIndex(day) {
      if (day >= 1 && day <= 7) return 1;
      if (day >= 8 && day <= 14) return 2;
      if (day >= 15 && day <= 21) return 3;
      return 4;
    }

    // 1. АКТИВНЫЙ ТУМБЛЕР «АРХИВ» ВНУТРИ ПОИСКА
    window.toggleArchiveFilter = function() {
      isArchiveActive = !isArchiveActive;
      
      if (isArchiveActive && selectedMonthKey === 'all') {
        const monthsSet = new Set();
        MOMENTS_DATA.forEach(item => {
          const d = new Date(item.created_at);
          monthsSet.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
        });
        const sorted = Array.from(monthsSet).sort().reverse();
        if (sorted.length > 0) {
          selectedMonthKey = sorted[0];
          document.getElementById('month-select').value = selectedMonthKey;
          renderWeeksSelector();
        }
      }

      updateArchiveToggleUI();
      updateFilterBadge();
      renderMoments();
    };

    function updateArchiveToggleUI() {
      const btn = document.getElementById('archive-toggle-btn');
      if (!btn) return;

      if (isArchiveActive) {
        btn.className = "px-3 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1.5 border select-none active:scale-95 bg-brand-primary border-brand-primary text-white shadow-sm shadow-brand-primary/25";
      } else {
        btn.className = "px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 border select-none active:scale-95 bg-brand-base border-brand-border text-brand-muted hover:text-brand-heading hover:bg-brand-bgAlt shadow-sm";
      }
    }

    // 2. ДРОПДАУН АВТОРОВ С ПОИСКОМ
    window.toggleAuthorDropdown = function(event) {
      if (event) event.stopPropagation();
      closeArchiveDropdown();

      const menu = document.getElementById('author-dropdown-menu');
      const chevron = document.getElementById('author-chevron');
      const isHidden = menu.classList.contains('hidden');

      if (isHidden) {
        menu.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        const input = document.getElementById('author-search-input');
        if (input) {
          input.value = '';
          authorSearchQuery = '';
          renderAuthorsList();
          setTimeout(() => input.focus(), 50);
        }
      } else {
        closeAuthorDropdown();
      }
    };

    window.closeAuthorDropdown = function() {
      const menu = document.getElementById('author-dropdown-menu');
      const chevron = document.getElementById('author-chevron');
      if (menu && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        if (chevron) chevron.classList.remove('rotate-180');
      }
    };

    window.filterAuthorsList = function(value) {
      authorSearchQuery = value.toLowerCase();
      renderAuthorsList();
    };

    function renderAuthorsList() {
      const container = document.getElementById('author-list-items');
      if (!container) return;

      const authorsMap = new Map();
      MOMENTS_DATA.forEach(m => {
        if (!authorsMap.has(m.author)) {
          authorsMap.set(m.author, m.author_avatar);
        }
      });

      const authors = Array.from(authorsMap.entries())
        .map(([name, avatar]) => ({ name, avatar }))
        .filter(a => a.name.toLowerCase().includes(authorSearchQuery))
        .sort((a, b) => a.name.localeCompare(b.name));

      let itemsHtml = `
        <button 
          type="button" 
          onclick="selectAuthor('all')" 
          class="flex items-center gap-2.5 px-3 py-2 rounded-full text-xs font-semibold text-left transition-all ${
            selectedAuthor === 'all' 
              ? 'bg-brand-primary text-white font-bold shadow-sm' 
              : 'text-brand-heading hover:bg-brand-bgAlt'
          }"
        >
          <div class="w-6 h-6 rounded-full bg-brand-bgAlt flex items-center justify-center text-brand-muted border border-brand-border text-[10px]">
            <i data-lucide="users" class="w-3.5 h-3.5"></i>
          </div>
          <span class="truncate">Все авторы</span>
        </button>
      `;

      if (authors.length === 0) {
        itemsHtml += `
          <div class="py-3 px-2 text-center text-brand-muted text-[11px] font-medium">
            Автор не найден
          </div>
        `;
      } else {
        itemsHtml += authors.map(author => `
          <button 
            type="button" 
            onclick="selectAuthor('${author.name}')" 
            class="flex items-center gap-2.5 px-3 py-2 rounded-full text-xs font-semibold text-left transition-all ${
              selectedAuthor === author.name 
                ? 'bg-brand-primary text-white font-bold shadow-sm' 
                : 'text-brand-heading hover:bg-brand-bgAlt'
            }"
          >
            <img src="${author.avatar}" alt="${author.name}" class="w-6 h-6 rounded-full object-cover ring-2 ring-brand-secondary" />
            <span class="truncate">${author.name}</span>
          </button>
        `).join('');
      }

      container.innerHTML = itemsHtml;
      lucide.createIcons();
    }

    window.selectAuthor = function(name) {
      selectedAuthor = name;
      document.getElementById('selected-author-label').innerText = name === 'all' ? 'Все авторы' : name;
      closeAuthorDropdown();
      renderMoments();
    };

    // 3. МЕНЮ ВЫБОРА МЕСЯЦА И НЕДЕЛЬ
    window.toggleArchiveDropdown = function(event) {
      if (event) event.stopPropagation();
      closeAuthorDropdown();

      const menu = document.getElementById('archive-dropdown-menu');
      const chevron = document.getElementById('archive-chevron');
      const isHidden = menu.classList.contains('hidden');

      if (isHidden) {
        menu.classList.remove('hidden');
        chevron.classList.add('rotate-180');
      } else {
        closeArchiveDropdown();
      }
    };

    window.closeArchiveDropdown = function() {
      const menu = document.getElementById('archive-dropdown-menu');
      const chevron = document.getElementById('archive-chevron');
      if (menu && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        if (chevron) chevron.classList.remove('rotate-180');
      }
    };

    function updateFilterBadge() {
      const badge = document.getElementById('active-filter-badge');
      if (!badge) return;

      if (!isArchiveActive || selectedMonthKey === 'all') {
        badge.textContent = 'Все записи';
        badge.className = 'hidden sm:inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-brand-bgAlt text-brand-muted border border-brand-border';
      } else {
        const [year, monthNum] = selectedMonthKey.split('-');
        const monthName = MONTH_NAMES[parseInt(monthNum) - 1];
        if (selectedWeek === 'all') {
          badge.textContent = `${monthName} ${year}`;
        } else {
          badge.textContent = `${monthName}, нед. ${selectedWeek}`;
        }
        badge.className = 'hidden sm:inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-brand-primary text-white shadow-sm';
      }
    }

    function initArchiveFilters() {
      const monthSelect = document.getElementById('month-select');
      
      const monthsSet = new Set();
      MOMENTS_DATA.forEach(item => {
        const d = new Date(item.created_at);
        monthsSet.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      });

      const sortedMonths = Array.from(monthsSet).sort().reverse();

      let optionsHtml = '<option value="all" class="bg-brand-base text-brand-heading">Все месяцы (Все записи)</option>';
      optionsHtml += sortedMonths.map(key => {
        const [year, monthNum] = key.split('-');
        const monthName = MONTH_NAMES[parseInt(monthNum) - 1];
        return `<option value="${key}" class="bg-brand-base text-brand-heading">${monthName} ${year}</option>`;
      }).join('');

      monthSelect.innerHTML = optionsHtml;
      monthSelect.value = selectedMonthKey;

      renderWeeksSelector();
      updateFilterBadge();
    }

    function renderWeeksSelector() {
      const weeksSelector = document.getElementById('weeks-selector');
      const weeksHint = document.getElementById('weeks-hint');
      if (!weeksSelector) return;

      if (selectedMonthKey === 'all') {
        weeksHint.textContent = '';
        weeksSelector.innerHTML = `
          <div class="py-3 px-3 text-center text-[11px] text-brand-muted bg-brand-bgAlt rounded-[16px] border border-brand-border font-medium">
            Сначала выберите месяц выше
          </div>
        `;
        return;
      }

      const [yearStr, monthStr] = selectedMonthKey.split('-');
      const year = parseInt(yearStr);
      const monthIndex = parseInt(monthStr) - 1;
      const monthFormatted = String(monthIndex + 1).padStart(2, '0');
      const lastDayOfMonth = new Date(year, monthIndex + 1, 0).getDate();
      const monthName = MONTH_NAMES[monthIndex];

      weeksHint.textContent = `${monthName} ${year}`;

      const weeks = [
        { id: 'all', label: 'Все недели месяца', sub: `Весь ${monthName}` },
        { id: 1, label: `Неделя 1`, sub: `1–7.${monthFormatted}` },
        { id: 2, label: `Неделя 2`, sub: `8–14.${monthFormatted}` },
        { id: 3, label: `Неделя 3`, sub: `15–21.${monthFormatted}` },
        { id: 4, label: `Неделя 4`, sub: `22–${lastDayOfMonth}.${monthFormatted}` }
      ];

      weeksSelector.innerHTML = weeks.map(w => {
        const isActive = (selectedWeek == w.id);
        return `
          <button 
            type="button"
            onclick="selectWeek('${w.id}')"
            class="w-full flex items-center justify-between px-3.5 py-2 rounded-full text-xs font-semibold transition-all ${
              isActive 
                ? 'bg-brand-primary text-white font-bold shadow-sm shadow-brand-primary/30' 
                : 'bg-brand-bgAlt text-brand-muted border border-brand-border hover:bg-brand-bg hover:text-brand-heading'
            }"
          >
            <span>${w.label}</span>
            <span class="text-[10px] ${isActive ? 'text-white' : 'text-brand-muted'}">${w.sub}</span>
          </button>
        `;
      }).join('');
    }

    window.changeMonth = function(monthKey) {
      selectedMonthKey = monthKey;
      selectedWeek = 'all';
      if (selectedMonthKey !== 'all') {
        isArchiveActive = true;
      }
      renderWeeksSelector();
      updateArchiveToggleUI();
      updateFilterBadge();
      renderMoments();
    };

    window.selectWeek = function(weekId) {
      selectedWeek = weekId === 'all' ? 'all' : parseInt(weekId);
      isArchiveActive = true;
      renderWeeksSelector();
      updateArchiveToggleUI();
      updateFilterBadge();
      renderMoments();
    };

    window.resetArchiveFilter = function() {
      selectedMonthKey = 'all';
      selectedWeek = 'all';
      isArchiveActive = false;
      const monthSelect = document.getElementById('month-select');
      if (monthSelect) monthSelect.value = 'all';
      renderWeeksSelector();
      updateArchiveToggleUI();
      updateFilterBadge();
      renderMoments();
    };

    // ЗАКРЫТИЕ ПРИ КЛИКЕ СНАРУЖИ
    document.addEventListener('click', (e) => {
      const archiveContainer = document.getElementById('archive-dropdown-container');
      if (archiveContainer && !archiveContainer.contains(e.target)) {
        closeArchiveDropdown();
      }

      const authorContainer = document.getElementById('author-dropdown-container');
      if (authorContainer && !authorContainer.contains(e.target)) {
        closeAuthorDropdown();
      }
    });

    // РЕАКЦИИ
    window.toggleReaction = function(event, id, emoji) {
      event.stopPropagation();
      
      const item = MOMENTS_DATA.find(m => m.id === id);
      if (!item) return;

      if (item.userReactions[emoji]) {
        item.userReactions[emoji] = false;
        item.reactions[emoji] = Math.max(0, item.reactions[emoji] - 1);
      } else {
        item.userReactions[emoji] = true;
        item.reactions[emoji] = (item.reactions[emoji] || 0) + 1;
      }

      renderMoments();
    };

    function renderActiveReactions(item) {
      const activeEmojis = Object.keys(item.reactions).filter(emoji => item.reactions[emoji] > 0);
      if (activeEmojis.length === 0) return '';

      return `
        <div class="px-5 pb-4 pt-2.5 flex items-center gap-1.5 overflow-x-auto custom-scrollbar border-t border-brand-border bg-brand-bgAlt/50">
          ${activeEmojis.map(emoji => {
            const count = item.reactions[emoji];
            const isReacted = item.userReactions[emoji];
            return `
              <button 
                onclick="toggleReaction(event, '${item.id}', '${emoji}')"
                class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border text-xs font-bold transition-all shrink-0 active:scale-95 ${
                  isReacted 
                    ? 'bg-brand-primary border-brand-primary text-white shadow-sm' 
                    : 'bg-brand-base border-brand-border text-brand-muted hover:border-brand-primary hover:text-brand-primary shadow-sm'
                }"
              >
                <span class="text-xs leading-none">${emoji}</span>
                <span class="text-[11px] ${isReacted ? 'text-white' : 'text-brand-muted'}">${count}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    // РЕНДЕР КАРТОЧЕК
    function renderMoments() {
      const filtered = MOMENTS_DATA.filter(item => {
        const matchesSearch = searchQuery === '' || 
          item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
          item.excerpt.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.author.toLowerCase().includes(searchQuery.toLowerCase());
        
        if (!matchesSearch) return false;

        if (selectedAuthor !== 'all' && item.author !== selectedAuthor) {
          return false;
        }

        if (isArchiveActive) {
          const itemDate = new Date(item.created_at);
          const itemMonthKey = `${itemDate.getFullYear()}-${String(itemDate.getMonth() + 1).padStart(2, '0')}`;
          const itemWeek = getWeekIndex(itemDate.getDate());

          if (selectedMonthKey !== 'all' && itemMonthKey !== selectedMonthKey) {
            return false;
          }
          if (selectedMonthKey !== 'all' && selectedWeek !== 'all' && itemWeek !== selectedWeek) {
            return false;
          }
        }

        return true;
      });

      if (filtered.length === 0) {
        momentsGrid.innerHTML = `
          <div class="col-span-full h-64 bg-brand-base border-2 border-dashed border-brand-border rounded-[28px] flex flex-col items-center justify-center p-6 text-center shadow-soft">
            <div class="w-12 h-12 rounded-full bg-brand-bgAlt text-brand-muted flex items-center justify-center mb-3">
              <i data-lucide="archive" class="w-6 h-6"></i>
            </div>
            <h3 class="text-brand-heading font-bold text-base">Ничего не найдено</h3>
            <p class="text-xs text-brand-muted mt-1 font-medium">Попробуйте изменить запрос или фильтры поиска</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const emojis = ['🔥', '❤️', '🚀', '⚡', '🏆', '💎'];

      momentsGrid.innerHTML = filtered.map(item => {
        return `
          <div 
            onclick="openImageModal('${item.id}')"
            class="bg-brand-base rounded-[24px] overflow-hidden border border-brand-bgAlt cursor-pointer group hover:border-brand-primaryLight hover:shadow-card-hover transition-all duration-300 flex flex-col justify-between h-full relative shadow-soft"
          >
            <!-- Превью -->
            <div class="relative h-52 overflow-hidden shrink-0 bg-brand-bgAlt">
              <img src="${item.image_url}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">

              <!-- Кнопка Огня с реакциями -->
              <div class="absolute top-3 right-3 z-20 group/picker" onclick="event.stopPropagation()">
                <button 
                  class="w-9 h-9 bg-brand-base/90 hover:bg-brand-base backdrop-blur border border-brand-border rounded-full transition-all shadow-md flex items-center justify-center active:scale-90 hover:scale-110"
                  title="Оставить реакцию"
                >
                  <svg class="w-5 h-5 drop-shadow-[0_1px_4px_rgba(249,115,22,0.4)]" viewBox="0 0 24 24" fill="url(#realisticFireGradient)">
                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3.5z"/>
                  </svg>
                </button>

                <!-- Реакции -->
                <div class="absolute right-0 top-11 hidden group-hover/picker:flex items-center gap-1 p-1.5 bg-brand-base/95 backdrop-blur-md border border-brand-border rounded-full shadow-xl z-30 transition-all animate-in fade-in zoom-in-95 duration-200">
                  ${emojis.map(emoji => `
                    <button 
                      onclick="toggleReaction(event, '${item.id}', '${emoji}')"
                      class="p-1.5 hover:bg-brand-bgAlt rounded-full text-base hover:scale-125 transition-transform active:scale-95"
                      title="Поставить ${emoji}"
                    >
                      ${emoji}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Контент -->
            <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
              <div>
                <h3 class="text-brand-heading font-extrabold text-base leading-snug group-hover:text-brand-primary transition-colors line-clamp-2 mb-2">
                  ${item.title}
                </h3>
                <p class="text-brand-muted text-xs leading-relaxed line-clamp-2 font-medium">
                  ${item.excerpt}
                </p>
              </div>

              <!-- Автор со story-style бейджем -->
              <div class="flex items-center gap-2.5 pt-3 border-t border-brand-border">
                <div class="p-[1.5px] rounded-full bg-gradient-to-tr from-brand-primary via-indigo-500 to-cyan-400 shrink-0">
                  <img 
                    src="${item.author_avatar}" 
                    alt="${item.author}" 
                    class="w-7 h-7 rounded-full object-cover border border-brand-base"
                  />
                </div>
                <span class="text-xs text-brand-heading font-bold tracking-tight">${item.author}</span>
              </div>
            </div>

            <!-- Нижняя плашка реакций -->
            ${renderActiveReactions(item)}

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // МОДАЛЬНОЕ ОКНО
    window.openImageModal = function(id) {
      const item = MOMENTS_DATA.find(m => m.id === id);
      if (!item) return;

      document.getElementById('modal-title').innerText = item.title;
      document.getElementById('modal-desc').innerText = item.excerpt;
      document.getElementById('modal-author-name').innerText = item.author;
      document.getElementById('modal-author-avatar').src = item.author_avatar;
      modalImageDisplay.src = item.image_url;

      imageModal.classList.remove('hidden');
      void imageModal.offsetWidth;
      imageModal.classList.remove('opacity-0');
      imageModalContent.classList.remove('scale-95');
      imageModalContent.classList.add('scale-100');
    };

    window.closeImageModal = function() {
      imageModal.classList.add('opacity-0');
      imageModalContent.classList.remove('scale-100');
      imageModalContent.classList.add('scale-95');
      setTimeout(() => {
        imageModal.classList.add('hidden');
        modalImageDisplay.src = '';
      }, 300);
    };

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderMoments();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!imageModal.classList.contains('hidden')) {
          closeImageModal();
        }
        closeArchiveDropdown();
        closeAuthorDropdown();
      }
    });

    // СТАРТ
    initArchiveFilters();
    renderMoments();
  </script>
</body>
</html>
