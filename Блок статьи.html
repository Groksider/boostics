<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>База знаний — Bento статьи, видео и изображения</title>
  
  <!-- Шрифт Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: '#2563EB',
            accent: '#FACC15',
          },
          boxShadow: {
            'micro': '0 4px 20px -2px rgba(0,0,0,0.04)',
            'card-hover': '0 12px 30px -4px rgba(37,99,235,0.12)',
            'soft': '0 4px 20px -2px rgba(0,0,0,0.04)',
            'float': '0 10px 30px -5px rgba(37,99,235,0.15)',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    #video-modal .custom-scrollbar::-webkit-scrollbar-thumb,
    #image-modal .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    #video-modal .custom-scrollbar::-webkit-scrollbar-thumb:hover,
    #image-modal .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    .wrap {
      width: 100%;
      max-width: 1780px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 0.75rem;
      padding-right: 0.75rem;
    }
    @media (min-width: 640px) {
      .wrap { padding-left: 1.5rem; padding-right: 1.5rem; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100/70 text-slate-900 font-sans antialiased selection:bg-yellow-400 selection:text-slate-900">

  <!-- ОСНОВНОЙ BENTO-БЛОК КОНТЕНТА -->
  <main class="p-2 sm:p-6 lg:p-8">
    <div class="max-w-[1780px] mx-auto bg-slate-50 border border-slate-200/90 shadow-2xl shadow-slate-300/50 rounded-[28px] sm:rounded-[44px] overflow-hidden relative">
      
      <!-- Верхний фирменный градиент -->
      <div class="h-1.5 w-full bg-gradient-to-r from-blue-600 via-indigo-500 to-yellow-400"></div>

      <div class="p-3 sm:p-6 lg:p-8 space-y-4 sm:space-y-6">
        
        <!-- ВЕРХНЯЯ СТРОКА: СЧЕТЧИК (СЛЕВА), ВЫБОР ИГРЫ И ПОИСК (СПРАВА) -->
        <div id="catalog-top" class="scroll-mt-24 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-white border border-slate-200 rounded-[24px] sm:rounded-[32px] p-3 sm:p-4 shadow-micro">
          
          <!-- Счетчик материалов -->
          <div class="text-[11px] sm:text-xs font-semibold text-slate-500 select-none px-1 leading-snug" id="items-counter">
            Найдено публикаций:<br class="sm:hidden"><span class="font-bold text-slate-700"> 24 // Страница 1 из 2</span>
          </div>
          
          <!-- Элементы управления справа -->
          <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-3 w-full sm:w-auto">
            
            <!-- Кнопка «Выбор игры» -->
            <div class="relative w-full sm:w-auto">
              <button 
                onclick="toggleTopGameDropdown(event)" 
                id="top-game-dropdown-btn" 
                class="w-full sm:w-auto bg-slate-50 border border-slate-200 hover:border-slate-300 text-[11px] sm:text-xs font-semibold text-slate-600 hover:text-blue-600 px-3.5 py-2 rounded-full transition-all flex items-center justify-between gap-2 outline-none select-none shadow-sm"
              >
                <span class="flex items-center gap-1.5">
                  <i data-lucide="gamepad-2" class="h-3.5 w-3.5 text-slate-400"></i>
                  <span id="top-game-btn-text">Выберите игру</span>
                </span>
                <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-slate-400"></i>
              </button>
              
              <!-- Выпадающее меню выбора игры -->
              <div id="top-game-dropdown-content" class="hidden absolute top-full left-0 sm:right-0 sm:left-auto mt-2 w-56 sm:w-64 bg-white border border-slate-200 rounded-2xl p-2 z-50 shadow-xl">
                <div class="relative mb-2 px-1">
                  <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-slate-400"></i>
                  <input
                    type="text"
                    id="top-dropdown-search-input"
                    placeholder="Поиск игры..."
                    class="w-full bg-slate-50 border border-slate-200 rounded-full pl-8 pr-3 py-1 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500"
                  />
                </div>
                <div id="top-dropdown-games-list" class="space-y-0.5 max-h-40 overflow-y-auto pr-1 custom-scrollbar"></div>
              </div>
            </div>

            <!-- Поисковая строка -->
            <div class="flex items-center bg-slate-50 border border-slate-200 rounded-full pl-3.5 pr-1 py-1 focus-within:border-blue-500 focus-within:bg-white transition-all shadow-inner w-full sm:w-64 lg:w-72">
              <i data-lucide="search" class="h-3.5 w-3.5 text-slate-400 shrink-0 mr-2"></i>
              <input 
                type="text" 
                id="top-search-input" 
                placeholder="Поиск по базе..." 
                class="bg-transparent font-medium text-xs text-slate-900 outline-none w-full placeholder-slate-400" 
              />
              <button onclick="triggerFadeUpAnimation(false)" class="bg-yellow-400 hover:bg-yellow-500 text-slate-900 text-[11px] sm:text-xs font-bold px-3.5 py-1.5 rounded-full shadow-sm transition-transform active:scale-95 shrink-0 ml-1">
                Найти
              </button>
            </div>

          </div>
        </div>

        <!-- BENTO СЕТКА КАРТОЧЕК -->
        <div 
          id="articles-grid" 
          class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-2.5 sm:gap-5 lg:gap-6 transition-all duration-300 ease-out opacity-100 translate-y-0"
        ></div>

        <!-- ПАГИНАЦИЯ -->
        <div id="pagination-block" class="mt-8 flex items-center justify-center gap-2 pt-4"></div>
      </div>
    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО ВИДЕОПЛЕЕРА (АДАПТИРОВАНО ДЛЯ ПК И ВЕРСИИ ДЛЯ ПК НА СМАРТФОНЕ) -->
  <div id="video-modal" class="fixed inset-0 z-[100] bg-zinc-950/95 backdrop-blur-md hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300 p-0 sm:p-4 md:p-6 lg:p-8 overflow-y-auto">
    
    <!-- Кнопка закрытия -->
    <button onclick="closeVideoModal()" class="absolute top-4 right-4 sm:top-6 sm:right-6 p-2 md:p-3 bg-black/50 md:bg-zinc-900/80 hover:bg-zinc-800 text-white rounded-full transition-colors z-50 shadow-lg">
      <i data-lucide="x" class="h-5 w-5 md:h-6 md:w-6"></i>
    </button>
    
    <!-- Контейнер модалки -->
    <div class="relative w-full max-w-[420px] md:max-w-[1000px] xl:max-w-[1200px] h-[100dvh] sm:h-[90vh] md:h-[85vh] sm:rounded-2xl bg-black md:bg-zinc-950 overflow-hidden shadow-2xl flex flex-col md:flex-row scale-95 transition-transform duration-300 ease-out border border-transparent md:border-zinc-800 m-auto shrink-0" id="video-modal-content">
      
      <!-- ЛЕВАЯ ЧАСТЬ: Видеоплеер -->
      <div class="relative flex-1 h-full bg-black flex items-center justify-center overflow-hidden group">
        
        <video id="modal-video-player" class="absolute inset-0 w-full h-full object-cover md:object-contain" loop playsinline></video>

        <!-- Оверлей управления (Play/Pause) -->
        <div class="absolute inset-0 z-10 cursor-pointer" onclick="togglePlayPause()"></div>
        <div id="play-indicator" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none opacity-0 transition-opacity duration-300">
           <div class="w-16 h-16 sm:w-20 sm:h-20 bg-black/50 rounded-full flex items-center justify-center backdrop-blur-md">
             <i data-lucide="play" class="h-8 w-8 sm:h-10 sm:w-10 text-white fill-white ml-2"></i>
           </div>
        </div>
        
        <!-- МОБИЛЬНЫЙ ИНТЕРФЕЙС (Скрывается на экранах от md: 768px и в режиме ПК) -->
        <div class="absolute inset-x-0 bottom-0 top-1/2 bg-gradient-to-t from-black/90 via-black/40 to-transparent z-10 pointer-events-none md:hidden"></div>
        <div class="absolute bottom-0 left-0 right-0 p-4 pb-6 sm:pb-4 z-30 flex items-end justify-between pointer-events-auto md:hidden">
           <div class="flex-1 pr-10">
             <div class="flex items-center gap-2 mb-3">
               <div class="w-9 h-9 rounded-full bg-emerald-500 border border-emerald-400 flex items-center justify-center text-zinc-950 font-bold text-sm shadow-md overflow-hidden">
                 <i data-lucide="gamepad-2" class="h-5 w-5"></i>
               </div>
               <div class="flex flex-col">
                 <span class="text-white font-bold text-sm leading-tight hover:underline cursor-pointer drop-shadow-md" id="modal-video-author-mobile">GGHUB_Official</span>
                 <span class="text-emerald-400 text-[11px] font-mono drop-shadow-md" id="modal-video-tags-mobile">#cyberpunk</span>
               </div>
             </div>
             <h2 class="text-white font-bold text-base leading-tight mb-1 drop-shadow-md" id="modal-video-title-mobile">Название</h2>
             <p class="text-zinc-200 text-xs line-clamp-2 drop-shadow-md leading-relaxed" id="modal-video-desc-mobile">Описание видео...</p>
           </div>
           
           <div class="flex flex-col items-center gap-5 pb-2">
             <button class="flex flex-col items-center gap-1.5 group">
               <div class="p-3 bg-zinc-900/60 backdrop-blur-md rounded-full border border-zinc-700/50">
                 <i data-lucide="heart" class="h-6 w-6 text-white group-hover:text-emerald-400 group-hover:fill-emerald-400 transition-all"></i>
               </div>
               <span class="text-white text-xs font-bold drop-shadow-md" id="modal-video-likes-mobile">12K</span>
             </button>
             <button class="flex flex-col items-center gap-1.5 group">
               <div class="p-3 bg-zinc-900/60 backdrop-blur-md rounded-full border border-zinc-700/50">
                 <i data-lucide="message-circle" class="h-6 w-6 text-white transition-all"></i>
               </div>
               <span class="text-white text-xs font-bold drop-shadow-md" id="modal-video-comments-mobile">428</span>
             </button>
           </div>
        </div>
      </div>

      <!-- ПРАВАЯ ЧАСТЬ: ДЕСКТОПНЫЙ ИНТЕРФЕЙС (Отображается на ПК, планшетах и смартфонах в режиме ПК) -->
      <div class="hidden md:flex w-[380px] xl:w-[420px] bg-zinc-950 border-l border-zinc-800 flex-col shrink-0">
        
        <!-- Шапка: Автор -->
        <div class="p-5 border-b border-zinc-800/60 flex items-center justify-between bg-zinc-900/20">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-emerald-500 border border-emerald-400 flex items-center justify-center text-zinc-950 font-bold shadow-md overflow-hidden shrink-0">
              <i data-lucide="gamepad-2" class="h-5 w-5"></i>
            </div>
            <div class="flex flex-col">
              <span class="text-zinc-100 font-bold text-sm hover:text-emerald-400 transition-colors cursor-pointer" id="modal-video-author-desktop">GGHUB_Official</span>
              <span class="text-zinc-500 text-xs">Автор клипа</span>
            </div>
          </div>
          <button class="px-4 py-1.5 text-xs font-bold text-zinc-950 bg-emerald-500 hover:bg-emerald-400 rounded-full transition-all active:scale-95 shadow-lg shadow-emerald-500/20">Профиль</button>
        </div>

        <!-- Тело: Скроллируемое описание и таймкоды -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6">
          <div class="mb-4">
            <span class="inline-block px-2 py-1 bg-zinc-900 border border-zinc-800 rounded-md text-emerald-400 text-[10px] font-mono mb-3 uppercase tracking-wider" id="modal-video-tags-desktop">#cyberpunk</span>
            <h2 class="text-zinc-100 font-extrabold text-lg leading-snug mb-3" id="modal-video-title-desktop">Название видео</h2>
            <p class="text-zinc-400 text-sm leading-relaxed" id="modal-video-desc-desktop">Подробное описание ролика будет здесь.</p>
          </div>

          <!-- Блок с таймкодами -->
          <div class="mt-8">
            <h3 class="text-zinc-100 font-bold text-xs uppercase tracking-wider mb-4 flex items-center gap-2">
              <i data-lucide="list-video" class="h-4 w-4 text-emerald-500"></i>
              Таймкоды видео
            </h3>
            <div id="modal-timestamps-desktop" class="space-y-1"></div>
          </div>
        </div>

        <!-- Подвал: Кнопки действий -->
        <div class="p-4 border-t border-zinc-800/60 bg-zinc-900/20 flex items-center justify-around">
          <button class="flex items-center gap-2.5 text-zinc-400 hover:text-emerald-400 transition-colors group">
            <i data-lucide="heart" class="h-6 w-6 group-hover:fill-emerald-400 transition-all"></i>
            <span class="font-bold text-sm" id="modal-video-likes-desktop">12K</span>
          </button>
          <button class="flex items-center gap-2.5 text-zinc-400 hover:text-white transition-colors group">
            <i data-lucide="message-circle" class="h-6 w-6 group-hover:fill-white transition-all"></i>
            <span class="font-bold text-sm" id="modal-video-comments-desktop">428</span>
          </button>
          <button class="flex items-center gap-2.5 text-zinc-400 hover:text-emerald-400 transition-colors group">
            <i data-lucide="share-2" class="h-6 w-6 group-hover:-translate-y-1 transition-transform"></i>
            <span class="font-bold text-sm">Поделиться</span>
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО АРТА (БЕЗ ТАЙМКОДОВ) -->
  <div id="image-modal" class="fixed inset-0 z-[100] bg-zinc-950/95 backdrop-blur-md hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300 p-0 sm:p-4 md:p-6 lg:p-8 overflow-y-auto">
    
    <!-- Кнопка закрытия -->
    <button onclick="closeImageModal()" class="absolute top-4 right-4 sm:top-6 sm:right-6 p-2 md:p-3 bg-black/50 md:bg-zinc-900/80 hover:bg-zinc-800 text-white rounded-full transition-colors z-50 shadow-lg">
      <i data-lucide="x" class="h-5 w-5 md:h-6 md:w-6"></i>
    </button>
    
    <!-- Контейнер модалки -->
    <div class="relative w-full max-w-[420px] md:max-w-[1000px] xl:max-w-[1200px] h-[100dvh] sm:h-[90vh] md:h-[85vh] sm:rounded-2xl bg-black md:bg-zinc-950 overflow-hidden shadow-2xl flex flex-col md:flex-row scale-95 transition-transform duration-300 ease-out border border-transparent md:border-zinc-800 m-auto shrink-0" id="image-modal-content">
      
      <!-- ЛЕВАЯ ЧАСТЬ: Изображение -->
      <div class="relative flex-1 h-full bg-black flex items-center justify-center overflow-hidden p-3 sm:p-6 select-none group">
        <img 
          id="modal-image-display" 
          src="" 
          alt="Изображение" 
          class="max-w-full max-h-full object-contain drop-shadow-2xl transition-transform duration-300 pointer-events-auto"
        />
        
        <!-- МОБИЛЬНЫЙ ИНТЕРФЕЙС -->
        <div class="absolute inset-x-0 bottom-0 top-1/2 bg-gradient-to-t from-black/90 via-black/40 to-transparent z-10 pointer-events-none md:hidden"></div>
        <div class="absolute bottom-0 left-0 right-0 p-4 pb-6 sm:pb-4 z-30 flex items-end justify-between pointer-events-auto md:hidden">
           <div class="flex-1 pr-10">
             <div class="flex items-center gap-2 mb-3">
               <div class="w-9 h-9 rounded-full bg-emerald-500 border border-emerald-400 flex items-center justify-center text-zinc-950 font-bold text-sm shadow-md overflow-hidden">
                 <i data-lucide="image" class="h-5 w-5"></i>
               </div>
               <div class="flex flex-col">
                 <span class="text-white font-bold text-sm leading-tight hover:underline cursor-pointer drop-shadow-md" id="modal-image-author-mobile"></span>
                 <span class="text-emerald-400 text-[11px] font-mono drop-shadow-md" id="modal-image-tags-mobile"></span>
               </div>
             </div>
             <h2 class="text-white font-bold text-base leading-tight mb-1 drop-shadow-md" id="modal-image-title-mobile"></h2>
             <p class="text-zinc-200 text-xs line-clamp-2 drop-shadow-md leading-relaxed" id="modal-image-desc-mobile"></p>
           </div>
           
           <div class="flex flex-col items-center gap-5 pb-2">
             <button class="flex flex-col items-center gap-1.5 group">
               <div class="p-3 bg-zinc-900/60 backdrop-blur-md rounded-full border border-zinc-700/50">
                 <i data-lucide="heart" class="h-6 w-6 text-white group-hover:text-emerald-400 group-hover:fill-emerald-400 transition-all"></i>
               </div>
               <span class="text-white text-xs font-bold drop-shadow-md" id="modal-image-likes-mobile"></span>
             </button>
             <button class="flex flex-col items-center gap-1.5 group">
               <div class="p-3 bg-zinc-900/60 backdrop-blur-md rounded-full border border-zinc-700/50">
                 <i data-lucide="message-circle" class="h-6 w-6 text-white transition-all"></i>
               </div>
               <span class="text-white text-xs font-bold drop-shadow-md" id="modal-image-comments-mobile"></span>
             </button>
           </div>
        </div>
      </div>

      <!-- ПРАВАЯ ЧАСТЬ: ДЕСКТОПНЫЙ ИНТЕРФЕЙС -->
      <div class="hidden md:flex w-[380px] xl:w-[420px] bg-zinc-950 border-l border-zinc-800 flex-col shrink-0">
        
        <!-- Шапка: Автор -->
        <div class="p-5 border-b border-zinc-800/60 flex items-center justify-between bg-zinc-900/20">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-emerald-500 border border-emerald-400 flex items-center justify-center text-zinc-950 font-bold shadow-md overflow-hidden shrink-0">
              <i data-lucide="image" class="h-5 w-5"></i>
            </div>
            <div class="flex flex-col">
              <span class="text-zinc-100 font-bold text-sm hover:text-emerald-400 transition-colors cursor-pointer" id="modal-image-author-desktop"></span>
              <span class="text-zinc-500 text-xs">Автор иллюстрации</span>
            </div>
          </div>
          <button class="px-4 py-1.5 text-xs font-bold text-zinc-950 bg-emerald-500 hover:bg-emerald-400 rounded-full transition-all active:scale-95 shadow-lg shadow-emerald-500/20">Подписаться</button>
        </div>

        <!-- Тело: Скроллируемое описание (без таймкодов) -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6">
          <div class="mb-4">
            <span class="inline-block px-2 py-1 bg-zinc-900 border border-zinc-800 rounded-md text-emerald-400 text-[10px] font-mono mb-3 uppercase tracking-wider" id="modal-image-tags-desktop"></span>
            <h2 class="text-zinc-100 font-extrabold text-lg leading-snug mb-3" id="modal-image-title-desktop"></h2>
            <p class="text-zinc-400 text-sm leading-relaxed" id="modal-image-desc-desktop"></p>
          </div>
        </div>

        <!-- Подвал: Кнопки действий -->
        <div class="p-4 border-t border-zinc-800/60 bg-zinc-900/20 flex items-center justify-around">
          <button class="flex items-center gap-2.5 text-zinc-400 hover:text-emerald-400 transition-colors group">
            <i data-lucide="heart" class="h-6 w-6 group-hover:fill-emerald-400 transition-all"></i>
            <span class="font-bold text-sm" id="modal-image-likes-desktop">12K</span>
          </button>
          <button class="flex items-center gap-2.5 text-zinc-400 hover:text-white transition-colors group">
            <i data-lucide="message-circle" class="h-6 w-6 group-hover:fill-white transition-all"></i>
            <span class="font-bold text-sm" id="modal-image-comments-desktop">428</span>
          </button>
          <button class="flex items-center gap-2.5 text-zinc-400 hover:text-emerald-400 transition-colors group">
            <i data-lucide="share-2" class="h-6 w-6 group-hover:-translate-y-1 transition-transform"></i>
            <span class="font-bold text-sm">Поделиться</span>
          </button>
        </div>

      </div>

    </div>
  </div>

  <script>
    const STEAM_FALLBACK = 'https://cdn.cloudflare.steamstatic.com/steam/apps/271590/capsule_616x353.jpg';

    // Публикации
    const BASE_ARTICLES = [
      { 
        title: 'Grand Theft Auto V: 15 скрытых механик, трюков с физикой и секретных локаций', 
        category: 'tutorials', 
        game: { id: 'gta5', name: 'GTA 5' }, 
        patch_version: 'v1.68 Online', 
        is_fresh: true, 
        author: { username: 'RockstarPRO' }, 
        views_count: 67300, 
        read_time_minutes: 14, 
        date: 'July 10, 2026', 
        image_url: 'https://cdn.cloudflare.steamstatic.com/steam/apps/271590/capsule_616x353.jpg', 
        icon_key: 'video', 
        contentType: 'video',
        video_duration: '14:25',
        video_url: 'https://www.w3schools.com/html/mov_bbb.mp4',
        excerpt: 'Большой эксклюзивный видеогайд по Лос-Сантосу. Разбираем скрытый потенциал кастомизации транспорта, прыжки на суперкарах и глитчи с физикой вертолетов.'

      const article = MOCK_ARTICLES.find(a => a.id === articleId);
      if (!article) return;

      const fullTitle = article.title;
      const tags = `#${article.game.name.replace(/\s+/g, '').toLowerCase()} #${article.category} #video`;
      const likes = article.views_count >= 1000 ? (article.views_count * 0.12 / 1000).toFixed(1) + 'K' : Math.floor(article.views_count * 0.12);
      const comments = Math.floor(article.views_count * 0.01) + 18;

      document.getElementById('modal-video-title-desktop').innerText = fullTitle;
      document.getElementById('modal-video-author-desktop').innerText = article.author.username;
      document.getElementById('modal-video-desc-desktop').innerText = article.excerpt + " В этом видео мы собрали самые эпичные и полезные моменты. Обязательно смотрите до конца и делитесь с друзьями!";
      document.getElementById('modal-video-tags-desktop').innerText = tags;
      document.getElementById('modal-video-likes-desktop').innerText = likes;
      document.getElementById('modal-video-comments-desktop').innerText = comments;

      document.getElementById('modal-video-title-mobile').innerText = fullTitle;
      document.getElementById('modal-video-author-mobile').innerText = article.author.username;
      document.getElementById('modal-video-desc-mobile').innerText = article.excerpt;
      document.getElementById('modal-video-tags-mobile').innerText = tags;
      document.getElementById('modal-video-likes-mobile').innerText = likes;
      document.getElementById('modal-video-comments-mobile').innerText = comments;

        { time: '1:45', label: 'Ключевые приемы' },

          <span class="text-emerald-400 font-mono text-xs bg-emerald-500/10 border border-emerald-500/20 px-1.5 py-0.5 rounded">${ts.time}</span>
          <span class="text-zinc-300 group-hover:text-white text-sm transition-colors">${ts.label}</span>
        </button>

      videoModal.classList.add('flex');
      document.body.classList.add('overflow-hidden');

      void videoModal.offsetWidth;
      videoModal.classList.remove('opacity-0');
      videoModalContent.classList.remove('scale-95');
      videoModalContent.classList.add('scale-100');
      
      modalVideoPlayer.play().catch(() => {});
      playIndicator.classList.add('opacity-0');
      lucide.createIcons();
    };

    function renderTopDropdownGamesList() {
      const filtered = GAMES.filter(g => 
        g.name.toLowerCase().includes(topDropdownSearchQuery.toLowerCase())
      );

      if (filtered.length === 0) {
        topDropdownGamesList.innerHTML = `<div class="text-[11px] text-slate-500 p-2 text-center">Не найдено</div>`;
        return;
      }

      topDropdownGamesList.innerHTML = filtered.map(g => {
        const isActive = currentGame === g.id;
        return `
          <button 
            onclick="setGame('${g.id}'); document.getElementById('top-game-dropdown-content').classList.add('hidden');"
            class="w-full flex items-center justify-between px-2.5 py-1.5 text-xs font-semibold rounded-lg transition-colors text-left ${
              isActive ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
            }"
          >
            <span>${g.name}</span>
            ${isActive ? `<i data-lucide="check" class="h-3.5 w-3.5 text-blue-600"></i>` : ''}
          </button>
        `;
      }).join('');

      if (currentGame === 'all') {
        topGameBtnText.innerText = "Выберите игру";

        const selectedGameObj = GAMES.find(g => g.id === currentGame);

        topGameBtnText.classList.replace('text-slate-600', 'text-blue-600');

      currentPage = 1;
      triggerFadeUpAnimation(false);

      const filtered = MOCK_ARTICLES.filter(article => {
        const matchesGame = currentGame === 'all' || article.game.id === currentGame;
        const matchesSearch = article.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                              article.excerpt.toLowerCase().includes(currentSearch.toLowerCase());
        return matchesGame && matchesSearch;
      });

      const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      itemsCounter.innerHTML = `Найдено публикаций:<br class="sm:hidden"><span class="font-bold text-slate-700"> ${filtered.length} // Страница ${currentPage} из ${totalPages}</span>`;

        paginationContainer.innerHTML = '';
        lucide.createIcons();

        const isImage = article.contentType === 'image';
        
        let clickAction = '';

                <div class="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
                  <div class="w-9 h-9 sm:w-12 sm:h-12 rounded-full bg-slate-900/65 backdrop-blur-md border border-white/30 text-white shadow-2xl group-hover/card:scale-110 group-hover/card:bg-indigo-600 group-hover/card:border-transparent transition-all duration-300 flex items-center justify-center">
                    <i data-lucide="maximize-2" class="w-4 h-4 sm:w-5 sm:h-5 text-white"></i>
                  </div>
                </div>
              ` : `
                <div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none group-hover/card:scale-110 transition-transform duration-500 z-10 text-white">
                  <i data-lucide="${article.icon_key}" class="w-8 h-8 sm:w-12 sm:h-12"></i>
                </div>
              `}
              
              <div class="absolute inset-0 p-2 sm:p-3.5 flex flex-col justify-between z-20 pointer-events-none">
                <div class="flex items-center justify-between w-full">
                  <div class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-full font-bold text-[8px] sm:text-[10px] bg-white/95 backdrop-blur-md shadow-sm text-blue-700 shrink-0">
                    <span class="h-1.5 w-1.5 rounded-full ${article.is_fresh ? 'bg-blue-600' : 'bg-slate-400'}"></span>
                    ${article.patch_version.split(' Patch')[0]}
                  </div>

                  ${isVideo ? `
                    <span class="px-1.5 sm:px-2.5 py-0.5 rounded-full bg-red-600 text-white font-extrabold text-[8px] sm:text-[9px] tracking-wider uppercase shadow-md flex items-center gap-1">
                      <i data-lucide="video" class="w-2.5 h-2.5 fill-white"></i> ВИДЕО
                    </span>
                  ` : isImage ? `
                    <span class="px-1.5 sm:px-2.5 py-0.5 rounded-full bg-indigo-600 text-white font-extrabold text-[8px] sm:text-[9px] tracking-wider uppercase shadow-md flex items-center gap-1">
                      <i data-lucide="image" class="w-2.5 h-2.5 fill-white"></i> АРТ
                    </span>
                  ` : `
                    <span class="px-1.5 sm:px-2.5 py-0.5 rounded-full bg-blue-600 text-white font-extrabold text-[8px] sm:text-[9px] tracking-wider uppercase shadow-md flex items-center gap-1">
                      <i data-lucide="file-text" class="w-2.5 h-2.5 fill-white"></i> СТАТЬЯ
                    </span>
                  `}
                </div>
                
                <div class="flex items-end justify-between w-full">
                  <div class="text-white text-[9px] sm:text-[11px] font-extrabold uppercase tracking-wider pl-0.5 select-none drop-shadow-md truncate max-w-[65%]">
                    ${article.game.name}
                  </div>

                  ${isVideo && article.video_duration ? `
                    <span class="px-1.5 py-0.5 rounded sm:rounded-md bg-black/75 backdrop-blur-md text-white text-[9px] sm:text-[10px] font-bold tracking-wide shadow-sm border border-white/10">
                      ${article.video_duration}
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>
            
            <!-- Текстовый блок -->
            <div class="p-2.5 sm:p-4 bg-white flex-1 flex flex-col justify-between gap-2">
              <div class="w-full">
                <h3 class="w-full text-[13px] sm:text-[16px] font-bold text-slate-900 leading-[1.24] tracking-[-0.015em] break-words line-clamp-2 sm:line-clamp-3 group-hover/card:text-blue-600 group-hover/card:underline transition-colors duration-200">
                  ${article.title}
                </h3>
                
                <p class="w-full text-[11px] sm:text-[13px] font-normal text-slate-500 leading-[1.35] line-clamp-2 mt-1 sm:mt-1.5 break-words">
                  ${article.excerpt}
                </p>
              </div>
              
              <div class="flex items-center justify-between pt-2 border-t border-slate-100 w-full text-[10px] sm:text-[11px] text-slate-500 font-medium mt-auto">
                <div class="flex items-center gap-1.5 min-w-0 pr-1">
                  <div class="h-5 w-5 rounded-full bg-gradient-to-tr from-blue-500 to-cyan-400 shadow-sm flex items-center justify-center text-[9px] text-white font-extrabold shrink-0 border border-white">
                    ${authorInitial}
                  </div>
                  <span class="truncate text-slate-700 font-semibold group-hover/card:text-slate-900 transition-colors max-w-[50px] sm:max-w-[70px]">${article.author.username}</span>
                </div>
                
                <div class="flex items-center gap-2 shrink-0">
                  <span class="flex items-center gap-0.5"><i data-lucide="eye" class="h-3 w-3 text-slate-400"></i> ${formattedViews}</span>
                  <span class="flex items-center gap-0.5"><i data-lucide="${isVideo ? 'play-square' : isImage ? 'image' : 'clock'}" class="h-3 w-3 text-slate-400"></i> ${article.read_time_minutes} мин</span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      renderPaginationDOM(totalPages);
      lucide.createIcons();
    }

    function renderPaginationDOM(totalPages) {
      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let html = `
        <button 
          onclick="changePage(${currentPage - 1})"
          ${currentPage === 1 ? 'disabled' : ''}
          class="p-2 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-slate-900 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-sm"
        >
          <i data-lucide="chevron-left" class="h-4 w-4"></i>
        </button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        const isActive = i === currentPage;
        html += `
          <button 
            onclick="changePage(${i})"
            class="h-9 w-9 flex items-center justify-center rounded-full text-xs font-bold transition-all ${
              isActive 
                ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' 
                : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 shadow-sm'
            }"
          >
            ${i}
          </button>
        `;
      }

      html += `
        <button 
          onclick="changePage(${currentPage + 1})"
          ${currentPage === totalPages ? 'disabled' : ''}
          class="p-2 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-slate-900 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-sm"
        >
          <i data-lucide="chevron-right" class="h-4 w-4"></i>
        </button>
      `;

      paginationContainer.innerHTML = html;
    }

    function triggerFadeUpAnimation(shouldScroll = false) {
      gridContainer.classList.remove('opacity-100', 'translate-y-0');
      gridContainer.classList.add('opacity-0', 'translate-y-3');
      
      setTimeout(() => {
        renderArticles();
        gridContainer.classList.remove('opacity-0', 'translate-y-3');
        gridContainer.classList.add('opacity-100', 'translate-y-0');
        
        if (shouldScroll) {
          document.getElementById('catalog-top').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 150);
    }

    window.changePage = function(pageNumber) {
      currentPage = pageNumber;
      triggerFadeUpAnimation(true); 
    };

    topSearchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value;
      currentPage = 1;
      renderArticles(); 
    });

    renderArticles();
  </script>
</body>
</html>
